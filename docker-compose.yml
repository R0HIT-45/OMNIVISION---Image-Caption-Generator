version: '3.8'

services:
  backend:
    build: .
    container_name: omnivision-backend
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./knowledge_base:/app/knowledge_base
      - ./static:/app/static
      - hf_cache:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnivision-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_OMNIVISION_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  hf_cache:
